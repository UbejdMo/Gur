<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the game use the whole screen, notch area included; the app pads for it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <!--
      Added to a phone's home screen, Gur opens like an app: full screen, without the browser's
      address bar. The paths are relative, so they also work under /Gur on GitHub Pages.
    -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1C1F1E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gur" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Dragging a tile must never pull the page down to refresh it, or bounce it. */
        overscroll-behavior: none;
        background-color: #1c1f1e;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- What a visitor (or a program reading the page) gets without JavaScript: what Gur is, and its policies. -->
    <noscript>
      <div
        style="max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; color: #fff; font-family: system-ui, sans-serif"
      >
        <h1>Gur</h1>
        <p>
          Gur is a free tile rummy game for 2 to 4 players, played the way it is in Kosovo. Play against bots, or with
          friends by lobby code. The game needs JavaScript: please switch it on to play.
        </p>
        <p>
          <a href="privacy.html" style="color: #f2c14e">Privacy policy</a> &middot;
          <a href="terms.html" style="color: #f2c14e">Terms of service</a>
        </p>
      </div>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
